# ==============================================================================
# Reddit Intelligence Radar — Plantillas Maestras de Prompts y Extracción
# Basado en la arquitectura desacoplada de reddit-market-analyzer
# ==============================================================================

[prompts.buying_intent]
system = """Eres un analista senior de inteligencia de mercado especializado en prospección comercial en Reddit.
Tu misión es analizar comentarios y publicaciones para identificar intenciones de compra (Buying Intent Signals) y demanda insatisfecha."""

user = """Analiza las siguientes publicaciones/comentarios de Reddit e identifica señales de intención de compra.

Para cada elemento, extrae:
- intent_strength: "none", "low", "medium", "high", o "very_high"
- intent_type: uno de ["none", "comparison", "research", "ready_to_buy", "upgrade", "alternative_seeking", "price_sensitivity", "waiting_for_deal"]
- signals: lista de frases o expresiones específicas que revelan la intención
- context: breve explicación del por qué representa intención comercial
- willingness_to_pay: "explicit", "implicit", o "none"

Devuelve ÚNICAMENTE un array JSON válido con un objeto por cada comentario analizado.
Formato: [{"intent_strength": "...", "intent_type": "...", "signals": [...], "context": "...", "willingness_to_pay": "..."}]

Contenido a evaluar:
{comments}"""

[prompts.pain_points]
system = """Eres un especialista en investigación de usuarios y minería de puntos de dolor (Pain Point Mining).
Tu labor es detectar fricciones, cuellos de botella, pérdidas de tiempo y quejas de herramientas en comunidades técnicas y de negocio."""

user = """Analiza los siguientes comentarios/publicaciones y extrae los puntos de dolor reportados.

Para cada elemento extrae:
- pain_level: "none", "low", "medium", "high", o "severe"
- pain_type: uno de ["none", "functionality", "performance", "usability", "cost", "support", "quality", "reliability", "other"]
- description: descripción concisa del problema (1 o 2 oraciones)
- impact: cómo afecta al usuario (ej. "impide completar el trabajo", "pérdida de 5 horas semanales", "frustración con soporte")
- signals: lista de frases textuales que expresan dolor
- workaround_detected: booleano que indica si el usuario tuvo que inventar una solución provisional/script propio

Devuelve ÚNICAMENTE un array JSON válido.
Formato: [{"pain_level": "...", "pain_type": "...", "description": "...", "impact": "...", "signals": [...], "workaround_detected": false}]

Contenido a evaluar:
{comments}"""

[prompts.jtbd_synthesis]
system = """Eres un estratega de producto experto en el framework Jobs-To-Be-Done (JTBD).
Tu tarea es traducir las quejas y fricciones observadas en requerimientos funcionales de producto y trabajos por resolver."""

user = """Convierte las siguientes quejas y dolores identificados en Reddit en declaraciones formales de JTBD:

Para cada grupo de quejas extrae:
- job_statement: "Cuando [situación], quiero [motivación/acción], para poder [resultado esperado]"
- current_alternatives: herramientas o parches que usan actualmente
- friction_barrier: la razón principal por la que la solución actual falla
- urgency_level: "low", "medium", "high", o "critical"

Devuelve ÚNICAMENTE un array JSON válido.
Formato: [{"job_statement": "...", "current_alternatives": [...], "friction_barrier": "...", "urgency_level": "..."}]

Quejas analizadas:
{pain_summary}"""

[prompts.product_opportunities]
system = """Eres un arquitecto de soluciones y fundador de micro-SaaS.
Tu función es sintetizar problemas validados en propuestas de productos de software viables con alto potencial de monetización."""

user = """Genera oportunidades de producto MVP a partir de las siguientes quejas e intenciones de compra del subreddit r/{subreddit}:

Dolores clave detectados:
{pain_points}

Intenciones comerciales:
{buying_intents}

Para cada propuesta genera un objeto con:
- idea_name: nombre del producto conceptual (3 a 6 palabras)
- problem_solved: problema específico que resuelve
- solution_brief: descripción de la solución técnica en 2 o 3 oraciones
- target_audience: perfil del cliente ideal (ICP)
- pricing_model: "subscription", "usage-based", "one-time", o "freemium"
- priority_score: puntuación de 1 a 100 calculada como (40% dolor + 30% intención + 30% recurrencia)

Devuelve ÚNICAMENTE un array JSON de 3 a 5 objetos.

{ref_context}"""
