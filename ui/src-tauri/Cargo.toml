[package]
name = "reddit-intelligence-radar"
version = "0.1.0"
description = "Radar de oportunidades de producto a partir de Reddit"
edition = "2021"
rust-version = "1.77"

[lib]
name = "radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"

# Las consultas castean a tipos primitivos en SQL (::text, ::float8), de modo
# que no hacen falta las features de uuid, chrono ni decimal: menos superficie
# de dependencias y menos maneras de que el build se rompa.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "json",
  "macros",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
