[package]
name = "reddit-intelligence-radar"
version = "0.1.0"
description = "Radar de oportunidades de producto a partir de Reddit"
edition = "2021"
rust-version = "1.77"

[lib]
name = "radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"

# Cliente HTTP hacia el sidecar Python. rustls en lugar de la pila TLS del
# sistema para que el binario no dependa de OpenSSL; aunque el trafico sea
# loopback, reqwest lo exige para compilar con https.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }

# Para consumir el flujo SSE del sidecar trozo a trozo.
futures-util = "0.3"

# El ciclo de vida del sidecar deja rastro en el log de la aplicacion.
log = "0.4"
tauri-plugin-log = "2"

# Las consultas castean a tipos primitivos en SQL (::text, ::float8), de modo
# que no hacen falta las features de uuid, chrono ni decimal: menos superficie
# de dependencias y menos maneras de que el build se rompa.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "json",
  "macros",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# El test de ciclo de vida del sidecar necesita un runtime async completo.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
