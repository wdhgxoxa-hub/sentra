# Canal estable sin triple de sistema: cada máquina usa su cadena por defecto.
# En Windows es MSVC (la que pide WebView2; el enlazador GNU no sirve allí) y
# en Linux, GNU. Fijar `stable-x86_64-pc-windows-msvc` hacía que rustup
# intentara instalar la cadena de Windows en Linux
# (tests/test_rust_toolchain.py).
[toolchain]
channel = "stable"
